on:
  push:
  workflow_dispatch:
name: Build
jobs:
  hid-bler:
    name: build for HID BLER
    runs-on: ubuntu-latest
    steps:
    - name: Install dependencies
      run: sudo apt-get install -y git wget flex bison gperf python3 python3-venv python3-setuptools cmake ninja-build ccache libffi-dev libssl-dev dfu-util libusb-1.0-0

    - name: Cache IDF
      id: cache-idf
      uses: actions/cache@v4
      with:
        path: esp-idf
        key: 1

    - name: Checkout IDF
      if: steps.cache-idf.outputs.cache-hit != 'true'
      uses: actions/checkout@v4
      with:
        repository: espressif/esp-idf
        ref: 97fb98a91b308d4f4db54d6dd1644117607e9692
        submodules: recursive
        path: esp-idf

    - name: Set up IDF tools
      run: bash ${GITHUB_WORKSPACE}/esp-idf/install.sh esp32c3

    # --- 修复 Python 环境 ---
    - name: Prepare IDF Python Environment
      run: |
        PYTHON_ENV_DIR=$(ls -td $HOME/.espressif/python_env/* | head -n 1)
        if [ -z "$PYTHON_ENV_DIR" ]; then
          echo "Error: Could not find IDF Python environment directory."
          ls -la $HOME/.espressif/
          exit 1
        fi
        echo "Found IDF Python Environment Directory: $PYTHON_ENV_DIR"
        
        IDF_PYTHON="$PYTHON_ENV_DIR/bin/python"
        if [ ! -f "$IDF_PYTHON" ]; then
          echo "Error: Python interpreter not found at $IDF_PYTHON"
          ls -la "$PYTHON_ENV_DIR/bin/"
          exit 1
        fi
        echo "Using Python interpreter: $IDF_PYTHON"

        # 强制重新安装 pip, wheel, 和一个稳定版本的 setuptools
        echo "Force-reinstalling pip, wheel, and a stable setuptools version..."
        $IDF_PYTHON -m pip install --force-reinstall pip wheel "setuptools<70.0.0"

        # 验证 pkg_resources
        echo "Verifying pkg_resources can be imported..."
        $IDF_PYTHON -c "import pkg_resources; print(f'Pkg_resources OK. setuptools version: {pkg_resources.get_distribution(\"setuptools\").version}'); import sys; print(f'Python path: {sys.executable}')"


    # --- 再次运行 IDF install.sh 来修复依赖 ---
    - name: Re-run IDF install to fix dependencies
      run: |
        bash ${GITHUB_WORKSPACE}/esp-idf/install.sh esp32c3


    - name: Checkout repo
      uses: actions/checkout@v4
      with:
        submodules: 'recursive'
        path: hid-bler

    - name: Modify ble_hidd.c
      run: cp ${GITHUB_WORKSPACE}/hid-bler/.github/ble_hidd.c.replace ${GITHUB_WORKSPACE}/esp-idf/components/esp_hid/src/ble_hidd.c

    - name: run build
      run: |
        cd ${GITHUB_WORKSPACE}/hid-bler
        # Now source the environment, it should use the fixed Python env with all deps
        . ${GITHUB_WORKSPACE}/esp-idf/export.sh
        idf.py build

    - name: upload firmware
      uses: actions/upload-artifact@v4
      with:
        name: Firmware for HID-BLER
        path: |
          /home/runner/work/usb-hid-bler/usb-hid-bler/hid-bler/build/bootloader/bootloader.bin
          /home/runner/work/usb-hid-bler/usb-hid-bler/hid-bler/build/esp_hid_device.bin
          /home/runner/work/usb-hid-bler/usb-hid-bler/hid-bler/build/partition_table/partition-table.bin
